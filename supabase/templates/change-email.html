<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Confirm your new email - Bill Reminder</title>
  <style>
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      background-color: #FAFAFA;
      margin: 0;
      padding: 0;
      -webkit-font-smoothing: antialiased;
      color: #1C1C1E;
    }
    .container {
      max-width: 600px;
      margin: 0 auto;
      padding: 40px 20px;
    }
    .card {
      background-color: #FFFFFF;
      border-radius: 12px;
      padding: 40px;
      box-shadow: 0 4px 16px rgba(0, 0, 0, 0.04);
      border: 1px solid #E5E5E5;
    }
    .logo {
      width: 48px;
      height: 48px;
      background-color: #5B5BD6;
      border-radius: 12px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      color: #FFFFFF;
      font-weight: bold;
      font-size: 20px;
      margin-bottom: 24px;
    }
    h1 {
      font-size: 24px;
      font-weight: 600;
      margin: 0 0 16px 0;
      color: #1C1C1E;
    }
    p {
      font-size: 16px;
      line-height: 1.5;
      color: #525252;
      margin: 0 0 24px 0;
    }
    .button {
      display: inline-block;
      background-color: #5B5BD6;
      color: #FFFFFF !important;
      font-size: 16px;
      font-weight: 600;
      text-decoration: none;
      padding: 14px 24px;
      border-radius: 8px;
      margin-bottom: 24px;
    }
    .footer {
      margin-top: 32px;
      font-size: 13px;
      color: #A3A3A3;
      text-align: center;
    }
  </style>
</head>
<body>
  <div class="container">
    <div class="card">
      <div class="logo">BR</div>
      <h1>Confirm your new email</h1>
      <p>We received a request to change the email address associated with your Bill Reminder account.</p>
      <a href="{{ .ConfirmationURL }}" class="button">Confirm New Email</a>
      <p style="font-size: 14px; color: #737373;">If you didn't request an email change, please ignore this email and your address will remain unchanged.</p>
    </div>
    <div class="footer">
      &copy; Bill Reminder. All rights reserved.
    </div>
  </div>
</body>
</html>
